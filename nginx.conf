server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html;
    gzip_min_length 512;

    # Los archivos no llevan hash en el nombre, así que un CDN por delante
    # serviría versiones viejas después de cada despliegue. Con no-cache el
    # navegador y el CDN siguen guardando la copia, pero revalidan por ETag:
    # cuesta un 304 y garantiza que lo desplegado es lo que se ve.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
